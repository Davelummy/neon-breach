name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dist module sanity
        run: node --input-type=module -e "import('./dist/data.js').then(() => console.log('data ok'))"

  qa-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chrome headless shell
        run: npx --no-install browsers install chrome-headless-shell@stable --path "$HOME/.cache/puppeteer"
      - name: QA smoke
        run: npm run qa
        env:
          CI: '1'
      - name: Responsive layouts
        run: npm run qa:responsive
      - name: Multiplayer gameplay
        run: npm run qa:multiplayer
